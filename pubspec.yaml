name: chroma_cam
description: PB / BB / YB を自動判別して透過し、カメラと合成撮影するアプリ
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  camera: ^0.12.1
  file_picker: ^10.3.10
  image: ^4.3.0
  path_provider: ^2.1.5
  permission_handler: ^13.0.2
  gal: ^2.3.0
  uuid: ^4.5.1
  google_fonts: ^8.2.1
  flutter_launcher_icons: ^0.14.3

dev_dependencies:
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: NotoSansJP
      fonts:
        - asset: fonts/NotoSansJP-Regular.ttf
          weight: 400
        - asset: fonts/NotoSansJP-Bold.ttf
          weight: 700  

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#0B0B10"
  adaptive_icon_foreground: "assets/icon/icon.png"